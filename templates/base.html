<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Photo Gallery{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center justify-between">
       <a href="{% if user.is_authenticated %}{% url 'gallery' %}{% else %}{% url 'login' %}{% endif %}" class="text-xl font-bold tracking-tight text-white"> PhotoGallery</a>
            {% if user.is_authenticated %}
               <a href="{% url 'profile' %}" class="text-gray-300 hover:text-white transition">{{ user.username }}</a>
                <a href="{% url 'logout' %}" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg transition">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="text-gray-300 hover:text-white transition">Login</a>
                <a href="{% url 'register' %}" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-lg transition">Register</a>
            {% endif %}
        </div>
    </nav>

    <!-- Messages -->
    {% if messages %}
        <div class="px-6 pt-4">
            {% for message in messages %}
                <div class="mb-2 px-4 py-3 rounded-lg text-sm
                    {% if message.tags == 'error' %}bg-red-900 text-red-200
                    {% elif message.tags == 'success' %}bg-green-900 text-green-200
                    {% else %}bg-blue-900 text-blue-200{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <!-- Main Content -->
    <main class="flex-1 px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-gray-600 text-xs py-4 border-t border-gray-800">
        © 2025 PhotoGallery
    </footer>

</body>
</html>
